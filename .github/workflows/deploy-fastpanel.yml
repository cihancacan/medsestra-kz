name: Deploy to FastPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.FASTPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.FASTPANEL_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy out folder
        run: |
          rsync -az --delete out/ "${{ secrets.FASTPANEL_USER }}@${{ secrets.FASTPANEL_HOST }}:${{ secrets.FASTPANEL_PATH }}/"
